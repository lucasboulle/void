# set -g default-terminal "$TERM"
# set -ag terminal-overrides ",$TERM:Tc"
set -g default-terminal "screen-256color"
set -as terminal-overrides ",xterm-256color:Tc"

# set navigation tmux mode like vim
set-window-option -g mode-keys vi
setw -g mode-keys vi

# enable mouse mode (tmux 2.1 and above)
set -g mouse on

# remap meta key
unbind C-b
set -g prefix C-Space

# Cross-platform clipboard integration
unbind -T copy-mode-vi Enter

# Pick the system clipboard command once, then reuse it in all copy-mode binds.
if-shell "uname | grep -q Darwin" \
  "set -g @copy_command pbcopy" \
  "set -g @copy_command 'xclip -in -selection clipboard'"

bind -T copy-mode-vi y send -X copy-pipe "#{@copy_command}"
bind -T copy-mode-vi Enter send -X copy-pipe "#{@copy_command}"
bind -T copy-mode-vi C-j send -X copy-pipe "#{@copy_command}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe "#{@copy_command}"
bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe "#{@copy_command}"
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe "#{@copy_command}"

set-environment -g PATH "${PATH}:/home/boulle/.local/bin"

# reload tmux
bind r run-shell "tmux source-file /Users/boulle/.config/tmux/tmux.conf >/dev/null && tmux list-clients -F '#{client_tty}' | xargs -I{} tmux refresh-client -t {} && tmux display-message 'Config reloaded in all tmux clients'"

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on' 

# reload config file (duplicate binding removed)
# bind R source-file ~/.config/tmux/tmux.conf

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
